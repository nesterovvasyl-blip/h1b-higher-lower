<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-1B Higher or Lower</title>
</head>
<body>
<h1>H-1B Higher or Lower</h1>
<p id="status"></p>

<div id="game">
  <div id="left" class="card"></div>
  <div id="right" class="card"></div>
  <div id="controls">
    <button id="higher">Higher</button>
    <button id="lower">Lower</button>
    <button id="next" hidden>Next</button>
  </div>
</div>

<div id="end" hidden>
  <h2 id="score"></h2>
  <p id="emoji"></p>
  <button id="again">Play again</button>
</div>

<script src="game.js"></script>
</body>
</html>
