<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H-1B Higher or Lower</title>
<meta name="description" content="Guess which tech job pays more, using real H-1B salary filings from the US Department of Labor.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><path id="ca-land"></path></defs>
</svg>

<header>
  <h1>H-1B <span>Higher</span> or <span>Lower</span></h1>
  <div id="status"></div>
  <ol id="progress" aria-label="Round results"></ol>
</header>

<main id="game">
  <div id="board">
    <article id="left" class="card"></article>
    <div class="vs">VS</div>
    <article id="right" class="card"></article>
  </div>
  <p class="hint">Does the right job pay <b>higher</b> or <b>lower</b>? Keys: ↑ / ↓</p>
</main>

<section id="end" hidden>
  <div class="result">
    <h2 id="score"></h2>
    <p id="verdict"></p>
    <p id="emoji"></p>
    <div class="end-actions">
      <button id="share" class="btn" hidden>Share</button>
      <button id="again" class="btn primary">Play again</button>
    </div>
  </div>
  <p class="insight"><span>💡</span> <span id="insight"></span></p>
  <h3>Your 16 cards, by pay</h3>
  <ol id="recap"></ol>
</section>

<footer>Median annual wage on certified H-1B LCA filings, Oct 2024 – Jun 2026 · Source: US Department of Labor</footer>

<script src="game.js"></script>
</body>
</html>
